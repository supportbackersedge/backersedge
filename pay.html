<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Complete Your Payment | Backers Edge</title>
<script src="https://checkout.bachs.io/bachs.js"></script>
<style>
  :root{--cream:#F5F0E8;--gold-deep:#F4B400;--dark:#0a0a0f;--sage:#3d6b5e;--ink:#1c1a16;--ink-soft:#5b564c;--line:rgba(28,26,22,0.12);}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif;background:var(--cream);color:var(--ink);line-height:1.6;min-height:100vh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;}
  header{padding:18px 24px;border-bottom:1px solid var(--line);}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.05rem;color:var(--ink);text-decoration:none;}
  .mark{background:var(--dark);color:var(--gold-deep);width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-size:.8rem;}
  main{flex:1;display:flex;align-items:center;justify-content:center;padding:24px 16px;}
  .card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:36px 28px;max-width:480px;width:100%;text-align:center;box-shadow:0 18px 50px rgba(0,0,0,0.08);}
  h1{font-size:1.45rem;font-weight:800;margin-bottom:12px;}
  p{color:var(--ink-soft);font-size:.98rem;margin-bottom:14px;}
  .amt{font-size:1.9rem;font-weight:800;color:var(--ink);margin:6px 0 2px;}
  .amt-note{font-size:.82rem;margin-bottom:18px;}
  .btn{display:inline-block;border:0;cursor:pointer;background:var(--gold-deep);color:var(--ink);font-weight:800;font-size:1rem;padding:14px 34px;border-radius:999px;text-decoration:none;}
  .btn:disabled{opacity:.6;cursor:default;}
  .btn:hover:not(:disabled){box-shadow:0 10px 24px rgba(244,180,0,0.3);}
  .tick{width:54px;height:54px;border-radius:50%;background:var(--sage);color:#fff;display:grid;place-items:center;font-size:1.6rem;margin:0 auto 14px;}
  .card.done{background:var(--dark);color:var(--cream);border-color:transparent;}
  .card.done h1{color:var(--cream);font-size:1.7rem;}
  .card.done p{color:rgba(245,240,232,.78);}
  .done-tick{width:64px;height:64px;border-radius:50%;background:var(--gold-deep);color:var(--dark);display:grid;place-items:center;margin:0 auto 16px;}
  .receipt{max-width:340px;margin:0 auto 14px;border:1px solid rgba(245,240,232,.18);border-radius:14px;padding:6px 16px;text-align:left;}
  .receipt-row{display:flex;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px solid rgba(245,240,232,.12);font-size:.9rem;}
  .receipt-row:last-child{border-bottom:0;}
  .receipt-row span{color:rgba(245,240,232,.65);}
  .receipt-row b{color:var(--cream);word-break:break-all;text-align:right;}
  .err{color:#b3261e;font-size:.88rem;margin-top:12px;min-height:1em;}
  .spin{width:34px;height:34px;border:4px solid var(--line);border-top-color:var(--gold-deep);border-radius:50%;margin:0 auto 14px;animation:s 1s linear infinite;}
  @keyframes s{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<header><a class="brand" href="https://backersedge.com"><span class="mark">BE</span> Backers Edge</a></header>
<main><div class="card" id="card"><div class="spin"></div><p>Finding your application…</p></div></main>
<script>
const WORKER_URL = "https://backers-payments.support-backersedge.workers.dev";
const LOOKUP_URL = "https://backers-lookup.support-backersedge.workers.dev";
const HOME = "https://backersedge.com";
const card = document.getElementById("card");
const ref = new URLSearchParams(location.search).get("ref") || "";
let payInit = false, paidDone = false;

function show(html, done){ card.innerHTML = html; card.className = done ? "card done" : "card"; }
const TICK = '<div class="done-tick"><svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>';
let lastAmount = "";
function receiptScreen(){
  const date = new Date().toLocaleDateString("en-US", {year:"numeric", month:"long", day:"numeric"});
  show(TICK + '<h1>Payment Successful</h1><div class="receipt">'
    + (lastAmount ? '<div class="receipt-row"><span>Amount</span><b>$' + Number(lastAmount).toLocaleString("en-US") + '</b></div>' : '')
    + '<div class="receipt-row"><span>Date</span><b>' + date + '</b></div>'
    + '<div class="receipt-row"><span>Order number</span><b>' + ref + '</b></div></div><p>Please wait a moment…</p>', true);
}
function notFound(){
  show('<h1>We couldn\'t find this application</h1><p>This payment link isn\'t valid. Please use the link from your email, or contact us and we\'ll help.</p><a class="btn" href="' + HOME + '">Go to Backers Edge</a>');
}
function paidScreen(){
  show(TICK + '<h1>Payment Received!</h1><p>We\'ve successfully received your payment. Thank you for choosing Backers Edge! Our team will review your campaign details and contact you within 24 hours to confirm the next steps.</p><a class="btn" href="' + HOME + '">Back to Home</a>', true);
}
function alreadyPaid(){
  show(TICK + '<h1>Already paid</h1><p>Your payment for this application has already been received. No action is needed. Our team will contact you within 24 hours.</p><a class="btn" href="' + HOME + '">Back to Home</a>', true);
}
function payScreen(amount){
  lastAmount = amount || "";
  const amt = amount ? '<div class="amt">$' + Number(amount).toLocaleString("en-US") + '</div><p class="amt-note">One flat fee, plus processing fee</p>' : "";
  show('<h1>Complete Your Application</h1><p>Your campaign application has been received. To complete your application, please make your payment below. Your application can only be processed once payment is confirmed.</p>' + amt + '<button class="btn" id="payBtn" onclick="startPayment()">Pay Now</button><div class="err" id="payErr"></div>');
}
async function startPayment(){
  const btn = document.getElementById("payBtn"), err = document.getElementById("payErr");
  btn.disabled = true; btn.textContent = "Opening payment…"; err.textContent = "";
  try {
    const r = await fetch(WORKER_URL + "/create", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({orderRef: ref})});
    const d = await r.json();
    if (!r.ok || !d.checkout_url) throw new Error("Server " + r.status + ": " + JSON.stringify(d).slice(0, 220));
    if (typeof Bachs === "undefined") throw new Error("Payment script did not load");
    if (!payInit) {
      const cu = new URL(d.checkout_url);
      if (cu.protocol !== "https:" || !/(^|\.)bachs\.io$/.test(cu.hostname)) throw new Error("Unexpected checkout address");
      Bachs.Initialize({ baseUrl: cu.origin, onEvent: ev => {
        if (ev.type === "checkout.completed") { paidDone = true; receiptScreen(); setTimeout(paidScreen, 3000); }
      }});
      payInit = true;
    }
    await Bachs.Checkout.open({ checkoutUrl: d.checkout_url });
  } catch (e) {
    err.textContent = "We couldn't open payment (" + (e && e.message ? e.message : "unknown") + "). Please try again, or contact support.";
  }
  if (!paidDone && btn) { btn.disabled = false; btn.textContent = "Pay Now"; }
}
(async function(){
  if (!/^[A-Za-z0-9_-]{8,64}$/.test(ref)) return notFound();
  try {
    const r = await fetch(LOOKUP_URL + "/lookup?ref=" + encodeURIComponent(ref));
    const d = await r.json();
    if (!r.ok || d.error) throw new Error("lookup");
    if (!d.found) return notFound();
    if (d.paid) return alreadyPaid();
    payScreen(d.amount);
  } catch (e) {
    show('<h1>Something went wrong</h1><p>We couldn\'t load your application right now. Please try again in a moment, or contact us.</p><a class="btn" href="' + HOME + '">Go to Backers Edge</a>');
  }
})();
</script>
</body>
</html>
